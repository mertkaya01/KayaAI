[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kayaai"
version = "0.3.0"
description = "kayaAI - yerel, çok-ajanlı kişisel yapay zeka sistemi"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - all rights reserved" }
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "pyyaml>=6.0,<7",
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kayaai = "kayaai.cli:main"

[tool.setuptools.packages.find]
include = ["kayaai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
