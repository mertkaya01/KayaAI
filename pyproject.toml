[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kayaai"
version = "0.17.0"
description = "kayaAI - yerel, çok-ajanlı kişisel yapay zeka sistemi"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - all rights reserved" }
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "pyyaml>=6.0,<7",
    "mcp>=2.3,<3",
    "fastapi>=0.115,<1",
    "websockets>=13,<18",
    "psutil>=6,<8",
    "numpy>=1.26,<3",
    "pypdf>=4,<7",
    "openpyxl>=3.1,<4",
    "python-docx>=1.1,<2",
    "reportlab>=4,<5",
    # Adım 12a — ekranı okuma
    "pillow>=10,<14",
    "pypdfium2>=4.30,<6",
    "mss>=9,<11",
    # Adım 12b — ses tanıma (yerel)
    "faster-whisper>=1.1,<2",
    "av>=11,<19",   # PyAV 19 faster-whisper 1.2.1'i bozuyor (decode_audio: metadata_errors kaldırıldı)
    # Adım 12d — tarayıcı otomasyonu (kurulu Edge'i sürer; tarayıcı indirmez)
    "playwright>=1.45,<2",
    # pywinrt 4.x projeksiyonları "4!10.0.x" sürüm çağıyla yayımlanır: "<5" bunları DIŞLAR, sınır "<5!0" olmalı
    "winrt-runtime>=2.3,<5; sys_platform == 'win32'",
    "winrt-Windows.Foundation<5!0; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections<5!0; sys_platform == 'win32'",
    "winrt-Windows.Globalization<5!0; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging<5!0; sys_platform == 'win32'",
    "winrt-Windows.Media.Ocr<5!0; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams<5!0; sys_platform == 'win32'",
    "winrt-Windows.Media.SpeechSynthesis<5!0; sys_platform == 'win32'",  # perception_check: Türkçe OneCore sesi
]

[project.optional-dependencies]
dev = ["pytest>=8", "packaging>=23"]

[project.scripts]
kayaai = "kayaai.cli:main"

[tool.setuptools.packages.find]
include = ["kayaai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
