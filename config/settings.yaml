# kayaAI genel ayarları.
# Yerel değişiklikler için bu dosyayı kopyalayıp config/settings.local.yaml yapın
# (git'e girmez, buradaki değerleri ezer). Ortam değişkenleri en yüksek önceliğe sahiptir:
#   KAYAAI_OLLAMA_URL, KAYAAI_DATA_DIR, KAYAAI_LOG_LEVEL

app_name: kayaAI

# Görev geçmişi (SQLite), loglar ve raporlar. Göreli yol proje köküne göredir.
data_dir: data

ollama:
  # Güvenlik: varsayılan yalnızca bu bilgisayar (localhost). Ağa açmayın.
  base_url: http://127.0.0.1:11434
  connect_timeout_s: 5
  # İlk istekte model diske/VRAM'e yüklenir; 16 GB VRAM'de 8B model ~5-20 sn sürebilir.
  request_timeout_s: 300
  max_retries: 2          # bağlantı hatası / 5xx için tekrar sayısı
  retry_backoff_s: 1.5    # her denemede katlanarak artar

orchestrator:
  default_worker: general
  default_timeout_s: 240
  # Tek GPU: aynı anda birden çok LLM görevi VRAM'i böler ve yavaşlatır. Varsayılan 1.
  max_parallel: 1
  # Worker çıktısı şemaya uymazsa, hata geri bildirimiyle kaç kez denensin.
  max_output_attempts: 3

permissions:
  # Bu izinleri gerektiren görevler onay sormadan çalışır.
  # Diğer her izin (fs.write, net, exec, screen, audio ...) kullanıcı onayı ister.
  auto_approve:
    - llm.inference

claude:
  # Claude modu: Claude Pro aboneliği varken Claude Code (Opus şef) takviye olarak devreye girer.
  # Kapalıyken kayaAI tamamen yerel çalışır. Her iki modda da önce yerel model kullanılır (D15).
  # Bu değer sadece varsayılandır; `kayaai claude on|off` ile değiştirilen durum data/ içinde saklanır.
  enabled: false
  # Claude Code bu kadar dakika içinde kayaAI'yi kullandıysa "yakın temas" gösterilir.
  contact_window_min: 15
  # Claude modunda şef (Opus) Claude Code oturumunun açılacağı klasör (`kayaai claude sync` üretir).
  # Boş bırakılırsa: C:\Users\<kullanıcı>\kayaAI-workspace. kayaAI repo'sunun içinde olamaz.
  workspace_dir:

memory:
  # Adım 9 — hafıza ve belge araması (tamamen yerel). Model: config/models.yaml → embed-m3 (bge-m3)
  enabled: true
  embed_model: embed-m3
  recall_in_chat: true        # sohbette ilgili hafıza/belge parçaları otomatik kullanılsın
  top_memories: 5
  top_chunks: 4
  # Benzerlik eşikleri (bge-m3, Windows ölçümü 2026-10-31); scripts/memory_check.py tür başına önerir
  min_score_memory: 0.60
  min_score_docs: 0.50
  chunk_chars: 900
  chunk_overlap: 120

conductor:
  # Yerel şef (`kayaai do`): en fazla adım, gözden geçirme (never | plan | always), düzeltme turu
  max_steps: 4
  review: plan
  max_revisions: 1
  # Çok adımlı işte nihai cevap: assemble (adım cevapları başlıklarla, LLM'siz) | llm (genel ajan yeniden yazar)
  merge: assemble
  # Karmaşıklık skoru (adım sayısı, mimari/tasarım/ödünleşim gibi kelimeler, uzunluk) >= bu değer -> Claude önerilir
  claude_threshold: 3
  # Adım 7 — uzman ajanın cevabını gözden geçirici inceler (ajan tanımında review.required). Üretici bir soruna
  # itiraz ederse anlaşmazlık: claude_first (Claude modu açıksa Claude kutusuna, değilse sana) | owner (hep sana)
  disputes: claude_first
  # Bir işin zaman bütçesi (sn); aşılırsa ek gözden geçirme/revizyon turları atlanır
  time_budget_s: 600
  # Geçici ajanlar (data/agents): yerel planlayıcı uygun ajan yoksa bir tane önerebilir; en fazla bu kadar geçici ajan
  allow_temp_agents: true
  max_temp_agents: 5

api:
  # Yerel API sunucusu (`kayaai api`): arayüzler buna bağlanır. Güvenlik: yalnızca 127.0.0.1; ağa açılamaz.
  host: 127.0.0.1
  port: 8765

files:
  # Ajanların dosya araçları YALNIZCA bu klasörlerde çalışır (sahip kararı, Adım 5).
  # kayaAI'nin kendi klasörü (okuma + yazma). Boşsa: C:\Users\<kullanıcı>\kayaAI-files
  home_dir:
  # Ek klasörler. access: read (yalnızca okuma) | read_write. Örnek:
  #   - path: C:\Users\MERT\Documents\Faturalar
  #     access: read
  allowed_dirs: []
  max_read_mb: 2
  max_write_mb: 5

approvals:
  # Bu kadar saat içinde karar verilmeyen onay talebi geçersiz olur (expired).
  expire_hours: 24

logging:
  level: INFO
  file: logs/kayaai.log
  max_bytes: 5000000
  backup_count: 5

speech:
  # Adım 12b — ses tanıma (bas-konuş, canlı altyazı). Tamamen yerel: ses kaydı diske yazılmaz.
  model: large-v3-turbo       # ~1,6 GB, MIT; ilk kullanımda sahip onayıyla data/models/whisper altına iner
  device: auto                # auto: GPU (CUDA) dene, olmazsa işlemci
  language: auto              # auto | tr | en
  max_seconds: 120
  idle_unload_s: 600
