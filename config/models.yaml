# kayaAI model kayıt defteri (MODEL_REGISTRY.md'de gerekçeleriyle anlatılır).
# Model değiştirmek için sadece bu dosyayı düzenleyin; kod değişmez.
#
# models.<anahtar>:
#   name          : Ollama model etiketi (ollama pull <name>)
#   purpose       : kısa açıklama
#   context_length: num_ctx; VRAM kullanımını doğrudan etkiler
#   think         : qwen3 gibi "düşünen" modellerde düşünme modu (true/false/null=gönderme)
#   keep_alive    : model VRAM'de ne kadar kalsın ("5m", "0" = hemen boşalt)
#   options       : Ollama options (temperature, top_p, ...)
#   approx_vram_gb: yaklaşık VRAM (Q4_K_M, 8K bağlam) - sadece bilgi amaçlı
#   license       : lisans (ticari kullanım öncesi doğrulayın)
#   status        : active (varsayılan) | candidate (aday, worker'a atanamaz)

models:
  general-8b:
    name: qwen3:8b
    purpose: Genel akıl yürütme, Türkçe/İngilizce sohbet, özet, planlama, sınıflandırma
    context_length: 8192
    think: false
    keep_alive: 10m
    options:
      temperature: 0.4
    approx_vram_gb: 6.5
    license: Apache-2.0

  # coder ajanının modeli. scripts/coder_bench.py --execute (2026-10-31, RTX 5070 Ti):
  # qwen2.5-coder:7b 4/5, qwen3:8b 3/5; ~152 tok/s. Düşünme modu yok (think ayarı gönderilmez).
  coder-7b:
    name: qwen2.5-coder:7b
    purpose: Kod yazma, inceleme, hata ayıklama (coder ajanı)
    context_length: 8192
    keep_alive: 10m
    options:
      temperature: 0.2
    approx_vram_gb: 4.7
    license: Apache-2.0
    status: active

  # Adım 9 — hafıza ve belge araması için metin vektörleri (embedding). Çok dilli (Türkçe iyi), 1024 boyut.
  # Sahip kararı (2026-10-31): SQLite + bge-m3. İndirme: ollama pull bge-m3 (~1.2 GB).
  embed-m3:
    name: bge-m3
    purpose: Metin vektörleri (hafıza ve belge araması); sohbet modeli değildir
    keep_alive: 30m
    approx_vram_gb: 1.3
    license: MIT
    status: active

  # --- Adaylar: kurulu, benchmark bekliyor. status: candidate olan model ajana atanamaz.

  vision-7b:
    name: qwen2.5vl:7b
    purpose: Görsel model — ekran görüntüsü ve fotoğrafları anlar (vision ajanı, Adım 12a); kullanılmayınca boşalır
    context_length: 8192
    keep_alive: 2m
    options:
      temperature: 0.2
    approx_vram_gb: 6.0
    license: Apache-2.0
    status: active
  llama31-8b:
    name: llama3.1:8b
    purpose: Genel model alternatifi (karşılaştırma için)
    context_length: 8192
    keep_alive: 10m
    approx_vram_gb: 6.0
    license: Llama 3.1 Community License (atıf zorunlu, 700M+ MAU kısıtı)
    status: candidate

  # Benchmark sonrası denenebilir (henüz indirmeyin):
  # general-14b:
  #   name: qwen3:14b
  #   purpose: Daha güçlü ana model (benchmark sonrası)
  #   context_length: 8192
  #   think: false
  #   keep_alive: 10m
  #   approx_vram_gb: 10.5
  #   license: Apache-2.0

# Hangi worker hangi modeli kullanır. Faz 3'te yeni worker'lar buraya eklenecek.
workers:
  general: general-8b
